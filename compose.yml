services:
  postgres:
    image: postgres:17
    environment:
      - POSTGRES_DB=batch
      - POSTGRES_USER=batch-user
      - POSTGRES_PASSWORD=batch-password
    ports:
      # random free host port: Spring Boot's Docker Compose support wires the datasource for you,
      # so the demo also starts when another Postgres already listens on 5432
      - "5432"
