plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.jobrunr.demo.spring'
version = '0.0.1-SNAPSHOT'
description = 'jobrunr-spring-batch'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // Spring Boot 4: plain 'spring-boot-starter-batch' runs Spring Batch without a database (resourceless JobRepository).
    // We want the JDBC-backed JobRepository (restartability + execution history), so we use the -jdbc starter.
    implementation 'org.springframework.boot:spring-boot-starter-batch-jdbc'
    implementation 'org.jobrunr:jobrunr-spring-boot-4-starter:9.0.3'
    implementation 'tools.jackson.dataformat:jackson-dataformat-csv'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'net.datafaker:datafaker:2.5.1'
    runtimeOnly 'org.springframework.boot:spring-boot-docker-compose'
    runtimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

tasks.named('test') {
    useJUnitPlatform()
}
