spring:
  application:
    name: jobrunr-spring-batch
  # The datasource (url, username, password) comes from compose.yml via spring-boot-docker-compose.
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  sql:
    init:
      mode: always

jobrunr:
  background-job-server:
    enabled: true
    poll-interval-in-seconds: 5
  dashboard:
    enabled: true
